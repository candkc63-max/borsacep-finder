  <body class="site-bg">

      /* Boğa arka planı Tailwind katmanının dışında; görsel sayfa yenilense de kalır. */
      body.site-bg {
        background-color: #030308 !important;

      #root {

        z-index: 1;
        min-height: 100vh;
      }
      html.dark body.site-bg .bg-card {
        background-color: hsl(220 18% 10% / 0.62);
        backdrop-filter: blur(10px);
      }
      html.light body.site-bg {
        background-image: none !important;
        background-color: #f7f7f8 !important;
      }
      html.light body.site-bg::before {
        display: none;
      }
    </style>
